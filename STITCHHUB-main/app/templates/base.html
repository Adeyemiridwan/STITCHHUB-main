<!DOCTYPE html>
<html lang="en">
    <!-- ========================================
         Head Section - Metadata & Styles
         ======================================== -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <title>StitchHub | {% block title %}{% endblock %}</title>

        <!-- ========== Google Fonts ========== -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- ========== Font Awesome Icons ========== -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

        <!-- ========== Bootstrap CSS ========== -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/partials.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/marketplace.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/request.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/orders.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/errors.css') }}">     
        <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">


        {% block extra_css %}{% endblock %}
    </head>

    <!-- ========================================
         Body Section - Page Content
         ======================================== -->
    <body>
        <!-- ===== Header Navigation ===== -->
        {% include 'partials/_header.html' %}

        <!-- ===== Main Content Area ===== -->
        <main class="main-wrapper">
            <div class="container-fluid px-0">
                {% include 'partials/_messages.html' %}
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- ===== Footer Section ===== -->
        {% include 'partials/_footer.html' %}

        <!-- ========== JavaScript ========== -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
